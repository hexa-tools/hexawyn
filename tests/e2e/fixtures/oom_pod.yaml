apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  namespace: hexawyn-test
  labels:
    hexawyn.io/fixture: "true"
    test: oom
spec:
  containers:
  - name: oom
    image: polinux/stress:latest
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "200M", "--timeout", "300s"]
    resources:
      limits:
        memory: "50Mi"
  restartPolicy: Never
