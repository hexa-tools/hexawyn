name: Publish

on:
  release:
    types:
      - published

jobs:
  integration-tests:
    name: Integration Tests (pre-release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --with dev --extras "aws gcp azure datadog"
      - name: Run integration tests
        run: |
          poetry run pytest tests/integration/ \
            -v \
            -m integration \
            --strict-markers \
            --tb=short \
            --durations=10

  unit-tests:
    name: Unit Tests (pre-release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --with dev --extras "aws gcp azure datadog"
      - name: Run unit tests with coverage
        run: |
          poetry run pytest tests/unit/ \
            --tb=short -q \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --cov=src/hexawyn \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=80

  e2e-tests:
    name: E2E Tests (pre-release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install k3d + kubectl
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Install Poetry + deps
        run: |
          pip install poetry
          poetry install --with dev

      - name: Create k3d cluster
        run: make cluster-up

      - name: Load E2E fixtures
        run: make cluster-load

      - name: Run E2E tests
        run: |
          poetry run pytest tests/e2e/ \
            -v -m e2e \
            --strict-markers \
            --tb=short \
            --durations=10

      - name: Delete cluster
        if: always()
        run: make cluster-down

  # Pré-releases -> TestPyPI
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [integration-tests, unit-tests, e2e-tests]
    if: github.event.release.prerelease == true
    environment: testpypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure TestPyPI
        run: |
          poetry config repositories.testpypi https://test.pypi.org/legacy/
          poetry config pypi-token.testpypi ${{ secrets.TESTPYPI_TOKEN }}

      - name: Build and publish
        run: |
          poetry build
          poetry publish -r testpypi

  # Releases stables -> PyPI
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [integration-tests, unit-tests]
    if: github.event.release.prerelease == false
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure PyPI
        run: |
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}

      - name: Build and publish
        run: |
          poetry build
          poetry publish

  # Releases stables -> Docker Hub
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: github.event.release.prerelease == false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hexatools/hexawyn:latest
            hexatools/hexawyn:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Releases -> attach install.sh + its SHA256 as release assets.
  publish-install-script:
    name: Publish install.sh + SHA256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate install.sh version matches release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          embedded="$(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' install.sh)"
          if [ -z "$embedded" ]; then
            echo "::error::could not read VERSION from install.sh"
            exit 1
          fi
          if [ "$embedded" != "$tag" ]; then
            echo "::error::install.sh VERSION='$embedded' != release tag '$tag'"
            exit 1
          fi
          echo "version OK: $embedded"

      - name: Generate SHA256 checksum
        run: |
          sha256sum install.sh > install.sh.sha256
          cat install.sh.sha256

      - name: Attach installer + checksum to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            install.sh.sha256