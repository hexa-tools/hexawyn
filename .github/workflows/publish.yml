name: Publish

on:
  release:
    types:
      - published

jobs:
  # Pré-releases -> TestPyPI
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == true
    environment: testpypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure TestPyPI
        run: |
          poetry config repositories.testpypi https://test.pypi.org/legacy/
          poetry config pypi-token.testpypi ${{ secrets.TESTPYPI_TOKEN }}

      - name: Build and publish
        run: |
          poetry build
          poetry publish -r testpypi

  # Releases stables -> PyPI
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure PyPI
        run: |
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}

      - name: Build and publish
        run: |
          poetry build
          poetry publish

  # Releases stables -> Docker Hub
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: github.event.release.prerelease == false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hexatools/hexawyn:latest
            hexatools/hexawyn:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max