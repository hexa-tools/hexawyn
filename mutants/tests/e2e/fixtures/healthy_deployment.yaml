apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-app
  namespace: hexawyn-test
  labels:
    hexawyn.io/fixture: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthy-app
  template:
    metadata:
      labels:
        app: healthy-app
    spec:
      containers:
      - name: app
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-app
  namespace: hexawyn-test
  labels:
    hexawyn.io/fixture: "true"
spec:
  selector:
    app: healthy-app
  ports:
  - port: 80
    targetPort: 80
