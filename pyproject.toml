[tool.poetry]
name = "hexawyn"
version = "0.1.0b0"
description = "AI-powered Kubernetes assistant — MCP server for cluster investigation & reliability"
authors = ["hexawyn team"]
readme = "README.md"
packages = [{include = "hexawyn", from = "src"}]
 
[tool.poetry.dependencies]
python = "^3.12"
fastmcp = "^3.2.0"
anthropic = "^0.40"
kubernetes = "^31.0"
duckdb = "^1.1"
cryptography = "^43.0"
pytz = "^2024.2"
httpx = "^0.28"
click = "^8.1"
langgraph = "^1.2.6"
textual = "^0.89"

# Cloud providers (optional)
boto3 = { version = "^1.35", optional = true }
botocore = { version = "^1.35", optional = true }
azure-identity = { version = "^1.17", optional = true }
azure-mgmt-containerservice = { version = "^33.0", optional = true }
azure-mgmt-monitor = { version = "^6.0", optional = true }
azure-monitor-query = { version = "^1.4", optional = true }
google-cloud-container = { version = "^2.50", optional = true }
google-cloud-monitoring = { version = "^2.22", optional = true }
google-cloud-trace = { version = "^1.13", optional = true }
google-cloud-logging = { version = "^3.11", optional = true }
google-auth = { version = "^2.35", optional = true }
openshift = { version = "^0.13", optional = true }
datadog-api-client = { version = "^2.28", optional = true }
openai = "^2.43.0"
python-dotenv = "^1.2.2"

[tool.poetry.extras]
aws = ["boto3", "botocore"]
azure = ["azure-identity", "azure-mgmt-containerservice",
         "azure-mgmt-monitor", "azure-monitor-query"]
gcp = ["google-cloud-container", "google-cloud-monitoring",
       "google-cloud-trace", "google-cloud-logging", "google-auth"]
openshift = ["openshift"]
datadog = ["datadog-api-client"]
all = ["boto3", "botocore",
       "azure-identity", "azure-mgmt-containerservice",
       "azure-mgmt-monitor", "azure-monitor-query",
       "google-cloud-container", "google-cloud-monitoring",
       "google-cloud-trace", "google-cloud-logging", "google-auth",
       "openshift",
       "datadog-api-client"]

[tool.poetry.scripts]
hexa = "hexawyn.cli.main:app"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.12"
ruff = "^0.4"
mypy = "^1.10"
types-pyyaml = "^6.0.12.20260518"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["src/hexawyn"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
markers = [
    "integration: requires real DuckDB, uses DemoAdapter",
    "e2e: requires real cluster and LLM, CI only",
]
