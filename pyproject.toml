[tool.poetry]
name = "hexawyn"
version = "0.1.0b0"
description = "AI-powered Kubernetes assistant — MCP server for cluster investigation & reliability"
authors = ["hexawyn team"]
readme = "README.md"
packages = [{include = "hexawyn", from = "src"}]
 
[tool.poetry.dependencies]
python = "^3.12"
fastmcp = "^2.0"
anthropic = "^0.40"
kubernetes = "^31.0"
duckdb = "^1.1"
httpx = "^0.28"
click = "^8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.12"
ruff = "^0.4"
mypy = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["src/hexawyn"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
