  - "Simulate scaling the checkout-service from 3 to 1 \u2014 is it safe during peak traffic?"
  - "Show me the blast radius if I remove the caching layer \u2014 which services depend on redis?"
  - What's the risk level of reducing api-gateway to 2 replicas given current CPU usage?
  description: "WHAT-IF IMPACT ANALYSIS: simulate the IMPACT of changes \u2014 scaling down a service,\
    \ removing a node, changing replicas. Shows effect on latency, error rate, dependent services, and\
    \ remaining headroom. Answers: \"what if I scale down auth-service to 1 replica\", \"impact of removing\
    \ a component\". This is about RISK ASSESSMENT of changes \u2014 NOT about fitting new workloads.\
    \ Do NOT use for: checking if new workloads fit (use cluster_headroom_simulation), consolidation plans\
