  - Show me the input schema for the custom tool security-scanner
  - What is the output format of the custom compliance audit tool?
  - Show me the JSON schema of the custom tool describe-api
  description: Describe a registered custom tool's contract, expected input parameters and output format
custom_tool_run:
  tool: custom_tool_run
  questions:
  - Run my custom analyzer finops-zombie-check on the data namespace
  - Execute the pci-compliance check with namespace=production
  - Launch my custom tool network-policy-auditor on all namespaces
  - Run the external security-scanner tool for the staging environment
  - Execute custom/helm-drift-detector on namespace default
  description: Run a registered custom or third-party analyzer tool against a namespace or the whole cluster
    with given parameters
custom_tools_list:
  tool: custom_tools_list
  questions:
  - What custom tools are registered and available?
  - List all third-party analyzers connected to hexawyn
  - Which external checks are currently active?
  - Show me all registered custom tools with their transport
  - Which custom analyzers can I call right now?
  description: List all registered custom and third-party analyzer tools connected to hexawyn, their transport
    and whether they are active
deployment_latency:
  tool: deployment_latency
  questions:
  - Is the latency of payment-service increasing since the last deployment?
  - Did the latest deployment introduce a performance regression?
  - Compare service latency before and after the deployment 3 hours ago
  - Is there a p99 regression after the rollout?
  - Should we rollback based on the latency delta after deployment?
  description: Compare service latency before and after a deployment to detect a performance regression,
    p99 regression after a rollout, and whether to roll back
detect_container_image_drift:
  tool: detect_container_image_drift
  questions:
  - Show me all deployments running a container image that differs from what is declared in Git
  - Is payment-service running the Helm-declared image, or a hotfix deployed directly?
  - Are any of our mutable image tags actually pointing to different bytes?
  - Which containers are out of sync because of a tag change versus a digest change?
  - "Ignore anything still pinned to latest \u2014 what's genuinely drifted?"
  description: Detect deployments whose running container image differs from Git, direct hotfixes, and
    mutable tags drifting by tag or digest
detect_cross_cluster_incident:
  tool: detect_cross_cluster_incident
  questions:
  - Is the same issue affecting multiple clusters simultaneously?
  - Is this a global infrastructure problem or isolated to one cluster?
  - Are all our clusters having the same ImagePullBackOff error?
  - Did the incident cascade from US to EU?
  - Check if the same failure is happening across all production clusters.
  description: Detect whether the same failure (like ImagePullBackOff) is affecting multiple clusters
    at once, if it is a global problem or isolated, and whether it cascaded between regions
detect_kustomize_patch_conflicts:
  tool: detect_kustomize_patch_conflicts
  questions:
  - "Which Kustomize overlays override the same field across multiple patches \u2014 are there any conflicting\
    \ or redundant patches that could cause unexpected behavior?"
  - Are any of my Kustomize patches setting the same field to different values in the production overlay?
  - Show me redundant patches in my Kustomize overlays that set values already defined in the base.
  - Are there any patch conflicts in overlays/staging that could cause an unexpected deployment configuration?
  - "Which patches are targeting resources that don't exist in my base \u2014 flag orphan patches."
  - List all conflicting fields in the production overlay with the winning value and source patch.
  description: Detect Kustomize overlays that override the same field with conflicting or redundant patches,
    patches duplicating base values, and orphan patches targeting missing resources
detect_log_anomalies:
  tool: detect_log_anomalies
  questions:
  - "Detect anomalies in the logs of the inventory-service pod over the last 4 hours \u2014 are there\
    \ unusual spikes, silent errors, or statistical outliers?"
  - Is there anything statistically abnormal in the checkout-service logs today?
  - Show me any silent failures in payment-service logs that don't have an ERROR keyword but look wrong.
  - Are there any log volume spikes in the order-service pod I should worry about?
  - Find outlier log lines in worker-pod's last 2 hours using anomaly detection.
  description: "Detect statistical anomalies in a pod's logs \u2014 unusual spikes, log volume outliers,\
    \ and silent failures that have no ERROR keyword but look wrong"
detect_manual_changes_outside_gitops:
  tool: detect_manual_changes_outside_gitops
  questions:
  - Which ConfigMaps or Secrets were manually modified outside of GitOps in the last 7 days?
  - Did anyone edit the payment-service Secret directly instead of going through Git?
  - Are all of our recent ConfigMap changes coming from ArgoCD?
  - Which changes in the last 3 days were made by a real person versus a CI pipeline?
  - Is our audit logging even configured?
  description: Detect ConfigMaps or Secrets modified manually outside GitOps, who changed them and when,
    and which changes bypassed ArgoCD versus came from a CI pipeline
detect_missing_probes:
  tool: detect_missing_probes
