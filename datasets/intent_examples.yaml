  - List all deployments without readiness probes in the production namespace.
  - How many critical workloads have no probes at all, and what probe types should I add?
  - Show me pods with misconfigured probe ports that don't match their exposed ports.
  - Are our StatefulSets and DaemonSets safe without probes, or should they be flagged?
  description: Find deployments and workloads with no liveness or readiness probes configured, missing
    health checks, and probe ports that don't match exposed ports
detect_network_segmentation_gaps:
  tool: detect_network_segmentation_gaps
  questions:
  - Are there pods that can communicate without any network policy restriction?
