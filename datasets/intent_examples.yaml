  - Is worker-eu-3 actually hot, or was that just a brief spike?
  - If a node is overloaded, which pods should we move first?
  - Do we have enough headroom elsewhere to redistribute load off our busiest node?
  - Are our hot nodes only busy during business hours, or is it constant?
  description: "OVERLOADED NODE DETECTION: find nodes consistently above 80% CPU or memory. Identify if\
    \ it's a genuine persistent hotspot vs brief spike, which pods to move first, whether it's only busy\
    \ business hours. Answers: \"which nodes are overloaded\", \"is it a real hotspot or spike\", \"which\
    \ pods to move\". This is about NODE-LEVEL hot spots \u2014 NOT cluster-wide capacity. Do NOT use\
    \ for: cluster capacity forecasting (use cluster_capacity_ceiling_forecast), workload fitting (use\
    \ cluster_headroom_simulation).\n"
keda_detect:
