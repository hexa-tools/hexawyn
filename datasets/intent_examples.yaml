adaptive_namespace_investigation:
  tool: adaptive_namespace_investigation
  questions:
  - "The production namespace is having issues \u2014 adaptively investigate it: start with a health summary,\
    \ then automatically drill into the most critical failing resources."
  - "Something's wrong in checkout \u2014 figure out what, without me telling you which pod to look at."
  - 'Give me a triage pass on staging: overview, top offenders, and what I should do about it.'
  - "Investigate payment with depth=1 \u2014 just tell me the single worst thing."
  - Why is auth degraded, and is it OOM, a bad deploy, or something else?
  description: Automatically investigate a namespace, start with a health summary then drill into the
    most critical failing pods, deployments and events without being told where to look
admin_endpoint_audit:
  tool: admin_endpoint_audit
  questions:
  - Show me all calls to /admin that failed with a 403
  - Are there unauthorized access attempts on the admin endpoints?
  - Who is repeatedly hitting /admin endpoints with 403 errors?
  - What is the 403 rate on /admin in the last 30 minutes?
  - Flag any IPs that have more than 5 failed admin calls in the last hour
  description: Audit access to admin endpoints for unauthorized activity, 403 failures, and suspicious
    IPs repeatedly hitting admin routes
advanced_namespace_event_analytics:
  tool: advanced_namespace_event_analytics
  questions:
  - "Give me an advanced analytics report of all events in the data-pipeline namespace over the past 6\
    \ hours \u2014 categorize by severity and highlight correlated incidents."
  - Were there any event storms in the checkout namespace today?
  - What are the top recurring event reasons in production over the last 6 hours?
  - Show me the event volume timeline for staging and flag any spikes.
  - Are there correlated incidents across multiple pods in data-pipeline right now?
  description: Deep analytics of Kubernetes events in a namespace over several hours, categorized by severity,
    with event storm detection and correlated incidents across pods
analysis_runs_list:
  tool: analysis_runs_list
  questions:
  - Are there any AnalysisRuns failing for my rollouts?
  - Which metrics failed in the payments-api analysis?
  - List all AnalysisRuns associated with the checkout rollout
  - Has the automated analysis passed for the production canary?
  - Show me all failed AnalysisRuns with their error messages
  description: List Argo Rollouts AnalysisRuns and their metric results, showing which automated canary
    analyses passed or failed
analyze_critical_namespace_events:
  tool: analyze_critical_namespace_events
  questions:
  - Drill into the critical events in the staging namespace with correlated runbook suggestions.
  - What are the critical incidents in production and what runbooks apply?
  - Is there a recurring OOMKilling incident in staging, and what's the recommended fix?
  - Correlate the critical events in checkout namespace into incidents and suggest runbooks.
  - Give me the detailed critical-event analysis for payment-namespace with root cause grouping.
  description: Identify critical Kubernetes events in a namespace, group them into incidents with root
    cause, and suggest matching runbooks for OOMKilling and recurring failures
analyze_failed_pipeline:
  tool: analyze_failed_pipeline
  questions:
  - "The pipeline deploy-payment-v3 failed \u2014 what is the root cause? Which task failed, what were\
    \ the error logs, and was it a flaky test or a real regression?"
  - "Why did the checkout-service pipeline fail \u2014 is this a flaky test or a real bug?"
  - Give me a root cause analysis for the failed order-api pipeline with a remediation recommendation.
  - Is the payment-gateway pipeline failure infrastructure-related or a code regression?
  - What's the confidence and impact score for the latest deploy-payment-v3 failure?
  description: Root cause analysis of a failed CI/CD pipeline from its logs, distinguishing a flaky test
    from a real code regression or infrastructure issue, with a remediation recommendation
analyze_incident_cost:
  tool: analyze_incident_cost
  questions:
  - How much did yesterday's outage cost us?
  - What was the financial impact of the payment service incident?
  - How much revenue did we lose during the downtime?
  - What is the business cost of this morning's incident?
  - How much did yesterday's outage cost us in euros?
  - Give me the business impact of the last service interruption.
  - How much did yesterday's outage cost us?
  - What was the financial impact of the payment service downtime?
  - How much revenue did we lose during the service interruption?
  description: Estimate the financial and business cost of an incident or outage in euros or dollars,
    including lost revenue during downtime
analyze_pod_logs:
  tool: analyze_pod_logs
  questions:
  - "Analyze the logs of pod api-gateway-7f9b in the last 30 minutes \u2014 are there recurring error\
    \ patterns or connection timeouts?"
  - Are there any connection refused errors in the payment-service pod logs?
  - "Why does checkout-api keep throwing errors \u2014 check its logs for the last hour"
  - How many errors and warnings has the auth-service pod logged recently?
  - Can you spot any recurring failure patterns in the worker pod's logs?
  - "Give me a hybrid analysis of the checkout pod logs \u2014 combine structured pattern detection with\
    \ a plain-English summary for the last hour."
  - "Reduce and summarize the payment-service logs \u2014 I don't want to read 3000 raw lines."
  - Give me both the raw pattern counts and a natural-language summary for the checkout pod.
  - "Give me a smart summary of the last 2000 log lines from the order-service pod \u2014 keep only unique\
    \ meaningful events and reduce noise."
  - Deduplicate the checkout pod logs and show me what actually happened, not 1000 repeated health checks.
  - Strip out the health-check noise from payment-service logs and show me the real events.
  description: Retrieve and analyze a pod's container logs for recurring error patterns, connection timeouts
    and failures, with deduplication, noise reduction and a plain-English summary
audit_openshift_sccs:
  tool: audit_rbac_permissions
  questions:
  - Show me the SecurityContextConstraints that allow privileged containers.
  - Which SCCs are the most permissive on this OpenShift cluster?
  - Are there any SecurityContextConstraints allowing run-as-any user?
  - Audit my OpenShift SCCs for privilege escalation risks.
  - List all security context constraints and flag the dangerous ones.
  description: "OpenShift-only. Audit OpenShift SecurityContextConstraints (SCC) for privilege escalation\
    \ risks, flagging SCCs that allow privileged containers or run-as-any user. Does NOT apply to vanilla\
    \ Kubernetes, k3s, EKS, GKE, or AKS \u2014 SCCs are an OpenShift concept."
audit_rbac_permissions:
  tool: audit_rbac_permissions
  questions:
  - Which service accounts have cluster-admin or overly broad permissions?
  - Is any service account in production bound to cluster-admin that shouldn't be?
  - Show me every service account with wildcard verbs or access to all resources
  - Which service accounts have permissions they've never actually used?
  - How much blast radius would we cut by tightening our over-privileged accounts?
  - Are there any service accounts with no bindings at all?
  description: Audit RBAC roles, service accounts and bindings for cluster-admin, wildcard verbs, overly
    broad or unused permissions, and dead accounts with no bindings
audit_secret_rotation:
  tool: audit_secret_rotation
  questions:
  - Show me all Kubernetes Secrets that haven't been rotated in more than 90 days
  - Is our production db-password secret overdue for rotation?
  - Which stale secrets are safe to delete?
  - Are any of our TLS certificates overdue for rotation?
  - Give me a prioritized checklist of secrets to rotate first
  - Which namespaces are exempt from our secret rotation policy?
  description: Check Kubernetes Secrets for age and flag those not rotated in 90 days, identify stale
    unused secrets safe to delete, and rank rotation urgency
audit_tls_compliance:
  tool: audit_tls_compliance
  questions:
  - Which services are running without TLS or with expired certificates right now?
  - Are there any services with certificates expiring in the next 30 days?
  - "Show me all production services with no TLS configured \u2014 high risk security exposure."
  - Which self-signed certificates are in use across the cluster?
  - Give me a TLS compliance audit report ranked by severity.
  - Are any services running behind a proxy that handles TLS termination instead?
  description: Audit TLS configuration across services for missing TLS, expired or soon-to-expire certificates,
    self-signed certs, and security exposure ranked by severity
canary_comparison:
  tool: canary_comparison
  questions:
  - Does the canary version of the order service have higher latency or error rate than stable?
  - Is the canary safe to promote based on OTel real-time metrics?
  - Compare p99 latency between canary v2.4 and stable v2.3 for the payments service
  - Should I promote or rollback the current canary of the auth service?
  - What is the error rate delta between the canary and stable deployments?
  description: Compare canary deployment latency and error rate against the stable baseline using real-time
    OTel metrics to decide whether to promote or rollback
calico_detect:
  tool: calico_detect
  questions:
  - Is Calico installed on this cluster and what version is running?
  - Which dataplane mode is Calico using, IPIP, VXLAN or eBPF?
  - Are the calico-node agents healthy on every node?
  - Is Calico the active CNI or is something else in charge?
  - Is any calico-node agent degraded or not ready right now?
  - Is tigera-operator (Calico Enterprise) detected on this cluster?
  description: Detect whether Calico is the active CNI and report its version, dataplane mode,
    and per-node calico-node agent health with a degradation summary
calico_policy_audit:
  tool: calico_policy_audit
  questions:
  - Which Calico-selected workloads have no ingress or egress restriction?
  - Find namespaces without a default-deny Calico policy covering their workloads.
  - Audit Calico L3/L4 coverage gaps and rank them by risk.
  - Which namespaces have Calico policies but no default-deny rule?
  - Show me the Calico workloads lacking any L7 (HTTP/TLS) restriction.
  - Are there workload namespaces with no Calico NetworkPolicy at all?
  description: Audit Calico network policies for L3/L4 coverage gaps — flag namespaces whose workloads
    lack a default-deny restriction and rank the gaps by risk
calico_segmentation_audit:
  tool: calico_segmentation_audit
  questions:
  - Which workloads can reach each other through Calico without a policy?
  - Build the Calico east-west segmentation matrix for all tiers.
  - Which tier-to-tier paths are allowed but unrestricted by a Calico policy?
  - Is my Calico setup fully segmented by default-deny, or are there gaps?
  - Show me the unreachable paths a policy should block between tiers.
  - Compare the Calico segmentation view against the vanilla NetworkPolicy view.
  description: Audit east-west segmentation based on Calico selectors and policies — build a tier-to-tier
    reachability matrix and flag allowed-but-unrestricted paths against the vanilla view
certs_challenges_list:
  tool: certs_challenges_list
  questions:
  - Are there any failed ACME challenges in my cluster?
  - Show me all pending ACME DNS-01 challenges
  - Which domains have errored HTTP-01 challenges?
  - List all ACME challenges in the production namespace
  - Why is my DNS challenge stuck in pending?
  description: List cert-manager ACME challenges (DNS-01, HTTP-01) that are pending, failed or errored,
    and explain why a challenge is stuck
certs_detect:
  tool: certs_detect
  questions:
  - Is Cert-Manager installed in my cluster?
  - How many certificates are expiring soon?
  - Detect Cert-Manager and show me the certificate counts
  - Are there any failed certificates in the cluster?
  - What is the Cert-Manager version and namespace?
  description: Detect whether cert-manager is installed, its version and namespace, and count certificates
    that are expiring soon or failed
certs_get:
  tool: certs_get
  questions:
  - Show me the details of the payments-api TLS certificate
  - When does the production wildcard certificate expire?
  - Is the staging certificate auto-renewing?
  - What is the issuer type for the frontend certificate?
  - Get the full status of the auth-service certificate
  description: Retrieve full details of a specific TLS certificate including expiry date, issuer type,
    and auto-renewal status
certs_issuer_get:
  tool: certs_issuer_get
  questions:
  - Show me the Let's Encrypt production issuer configuration
  - Is the staging ClusterIssuer ready and connected?
  - What ACME server is my issuer pointing to?
  - Why is the Vault issuer not ready?
  - Get the detail of the self-signed issuer
  description: Get details of a specific cert-manager Issuer or ClusterIssuer, its ACME server, readiness
    and why it may not be ready
certs_issuers_list:
  tool: certs_issuers_list
  questions:
  - List all Certificate Issuers and ClusterIssuers
  - What Let's Encrypt issuers are configured?
  - Show me all issuers and their readiness status
  - Are there any self-signed or Vault issuers in my cluster?
  - Which ClusterIssuers are available cluster-wide?
  description: List all cert-manager Issuers and ClusterIssuers, their type (Let's Encrypt, Vault, self-signed)
    and readiness status
certs_list:
  tool: certs_list
  questions:
  - What is the status of all my Cert-Manager certificates?
  - List all TLS certificates with their expiration dates
  - Show me which certificates will expire in the next 30 days
  - Are all my Let's Encrypt certificates valid?
  - Which certificates are currently not ready or failed?
  description: List all TLS certificates managed by cert-manager with expiration dates, validity and which
    ones are not ready or failed
certs_requests_list:
  tool: certs_requests_list
  questions:
  - Show me recent CertificateRequests in my cluster
  - Are there any pending certificate requests?
  - List all CertificateRequests in the production namespace
  - What is the status of the latest cert request for staging?
  - Are any certificate requests failing repeatedly?
  description: List cert-manager CertificateRequests, showing pending signing requests and those failing
    repeatedly
certs_status_explain:
  tool: certs_status_explain
  questions:
  - Why was the payments-api certificate not renewed?
  - Explain why this TLS certificate is in failed status
  - What is causing the certificate to not be ready?
  - Why is my Let's Encrypt certificate stuck in issuing?
  - What should I do to fix the renewal failure?
  description: Explain why a cert-manager certificate failed to renew, is stuck in issuing, or is not
    ready, and how to fix it
check_cluster_certificate_health:
  tool: check_cluster_certificate_health
  questions:
  - Which TLS certificates in the cluster are expiring soon?
  - Are any certificates going to expire in the next 7 days?
  - Show me all expired certificates across all namespaces
  - "Which TLS secrets are not referenced by any ingress \u2014 orphaned certs?"
  - Is cert-manager managing the renewal of my production certificates?
  description: Check cluster-wide TLS certificate health, find certificates expiring within days, expired
    certs across namespaces, and orphaned TLS secrets not referenced by any ingress
check_cluster_operator_health:
  tool: check_cluster_operator_health
  questions:
  - Are all OpenShift cluster operators healthy right now?
  - Which cluster operators are Degraded or Progressing, and what is the root cause?
  - Has the etcd cluster operator been degraded long enough to be a chronic problem?
  - "Give me a summary of ClusterOperator health \u2014 how many are healthy versus degraded?"
  - "Why is my OpenShift upgrade stuck \u2014 which operators are still progressing?"
  - Show me every degraded cluster operator with its condition message.
  - Which cluster operators are Degraded or Progressing?
  - Has the etcd cluster operator been degraded long enough to be chronic?
  description: "OPENSHIFT OPERATOR HEALTH: check all ClusterOperators \u2014 Available, Progressing, Degraded\
    \ status. Answers: \\\"are cluster operators healthy\\\", \\\"which operators are degraded\\\", \\\
    \"operator health check\\\". This is OPENSHIFT-SPECIFIC \u2014 only works on OpenShift clusters. Do\
    \ NOT use for: generic pod health (use list_pods), machine config pools (use check_machine_config_pool_status).\n"
check_disruption_risks:
  tool: check_disruption_risks
  questions:
  - Do we have any service disruption risks this week?
  - Are there upcoming memory saturation or SLO breach risks?
  - Which services risk an interruption in the next 7 days?
  - Should I plan an intervention this week to avoid an outage?
  - Are there any service disruption risks this week?
  - Are there upcoming memory saturation or SLO breach risks?
  - Which services are at risk in the next 7 days?
  description: Predict upcoming service disruption risks in the next 7 days, including memory saturation
    and SLO breach risks, so an intervention can be planned before an outage
check_machine_config_pool_status:
  tool: check_machine_config_pool_status
  questions:
  - What is the current status of all MachineConfigPools in the cluster?
  - Are any nodes stuck in an update or degraded MachineConfigPool state?
  - Which MachineConfigPool is degraded, and what is the reason it failed to apply?
  - "Has the worker pool been updating for too long \u2014 is the rollout stuck?"
  - "Give me a summary of MachineConfigPool health \u2014 how many pools are healthy versus degraded?"
  - Show me the current and desired MachineConfig for each pool.
  - What is the status of all MachineConfigPools in the cluster?
  - Are any nodes stuck in an update or degraded state?
  - Which MachineConfigPool is degraded, and what is the reason?
  description: "MACHINE CONFIG POOL STATUS: check OpenShift MachineConfigPools \u2014 ready, updated,\
    \ degraded machine counts. Answers: \\\"are machine config pools ready\\\", \\\"MCP status\\\", \\\
    \"any degraded nodes from config changes\\\". Do NOT use for: cluster operator health (use check_cluster_operator_health),\
    \ general node health (use hot_node_analysis).\n"
check_resource_constraints:
  tool: check_resource_constraints
  questions:
  - Are any pods in production close to hitting their CPU or memory limits? Which ones are throttled or
    at risk of OOMKill?
  - Show me all containers where CPU usage exceeds 80% of the limit
  - Which pods are at risk of being OOMKilled in the staging namespace?
  - Are there any pods running without resource limits configured?
  - Give me a resource pressure report for all containers in production, sorted by risk
  description: "RESOURCE LIMIT HEALTH CHECK: check which pods are near CPU/memory limits, throttled, or\
    \ at OOMKill risk. Finds containers without resource limits configured. This is a SAFETY check \u2014\
    \ \"are my pods going to crash\". Answers: \"pods near OOMKill\", \"throttled containers\", \"missing\
    \ resource limits\". Do NOT use for: capacity forecasting (use cluster_capacity_ceiling_forecast),\
    \ simulating new workloads (use cluster_headroom_simulation), cost savings (use estimate_rightsizing_savings).\n"
cluster_capacity_ceiling_forecast:
  tool: cluster_capacity_ceiling_forecast
  questions:
  - "At the current resource consumption growth rate, when will the cluster run out of node capacity \u2014\
    \ in days or weeks?"
  - Is the cluster CPU or memory going to run out first?
  - How many days until we need to add worker nodes?
  - Is our cluster capacity trending up, down, or flat over the last two weeks?
  - Did adding that node last week actually change our growth trend?
  description: "CAPACITY RUNWAY FORECAST: predict WHEN the cluster will run out of node capacity at current\
    \ growth rate. Shows if CPU or memory runs out first, how many days until new nodes are needed, and\
    \ growth trend. Answers: \"when will we need more nodes\", \"CPU or memory bottleneck\", \"days until\
    \ capacity exhausted\". This is a LONG-TERM TREND tool \u2014 NOT for simulating specific workloads.\
    \ Do NOT use for: checking if specific workloads fit (use cluster_headroom_simulation), current pod\
    \ resource issues (use check_resource_constraints).\n"
cluster_headroom_simulation:
  tool: cluster_headroom_simulation
  questions:
  - If I deploy 3 new microservices next sprint, each requiring 500m CPU and 512Mi memory, will the cluster
    handle the load without adding new nodes?
  - Do we have enough headroom to add another 2 replicas of the payment service?
  - Would these proposed workloads fit, or do we need to scale the node pool first?
  - Is memory or CPU going to be the bottleneck if we ship these three services?
  - Can this pod's resource request even fit on any of our current nodes?
  description: "WORKLOAD FIT SIMULATION: simulate whether SPECIFIC proposed workloads or extra replicas\
    \ fit on current nodes. Shows if CPU or memory is the bottleneck, whether node pool must be scaled\
    \ first. Answers: \"can I deploy 3 new services\", \"will adding 2 replicas fit\", \"do I need more\
    \ nodes first\". This is for SPECIFIC \"what-if\" scenarios with concrete numbers \u2014 NOT general\
    \ capacity trends. Do NOT use for: long-term capacity trends (use cluster_capacity_ceiling_forecast),\
    \ pod-level resource limits (use check_resource_constraints), consolidation of existing workloads\
    \ (use run_consolidation).\n"
compare_cluster_health:
  tool: compare_cluster_health
  questions:
  - Compare the health of cluster prod-eu vs prod-us.
  - "Which cluster has more failing pods \u2014 EU or US?"
  - Is prod-eu in worse shape than prod-us during this incident?
  - What are the health deltas between our two production regions?
  - Which cluster should I investigate first during this multi-region outage?
  description: Compare the health of two clusters side by side, showing failing pod deltas between regions
    and which cluster to investigate first during a multi-region outage
compare_service_cost:
  tool: compare_service_cost
  questions:
  - What is the total infrastructure cost of the payment-service this month vs last month?
  - "How has the cost of auth-service changed month-over-month \u2014 is it increasing or decreasing?"
  - Show me the cost breakdown by pod for payment-service this month.
  - Which services have the highest cost increase compared to last month?
  - What is the CPU and memory cost trend for our production services?
  - Did the checkout-service cost decrease after our optimization efforts last sprint?
  description: 'PER-SERVICE MONTH-OVER-MONTH COMPARISON: compare a specific service''s cost this month
    vs last month. Breaks down CPU and memory cost per pod, ranks services by cost increase. Answers:
    "how much did service X cost this month vs last month", "which service had the biggest cost increase".
    REQUIRES a specific service name. Do NOT use for: cluster-wide spend forecast (use forecast_cost),
    team-level breakdown (use compute_team_cost), finding over-provisioned namespaces (use detect_over_provisioned_namespaces).

    '
compute_budget_intelligence:
  tool: compute_budget_intelligence
  questions:
  - Are we going to exceed our monthly cloud budget?
  - What is the state of our cloud budget this month?
  - Am I on track to overspend on infrastructure?
  - Should I be worried about our cloud cost increase?
  - Are we going to exceed our monthly cloud budget?
  - What's the state of our cloud budget this month?
  - Am I on track to overspend on infrastructure?
  description: "BUDGET HEALTH CHECK (YES/NO): assess if the monthly cloud budget is on track or at risk\
    \ of being exceeded. This is a binary health assessment \u2014 \"are we over budget\" \u2014 NOT a\
    \ cost projection. Answers: \"are we going to exceed our budget\", \"should I be worried about cloud\
    \ cost\". Do NOT use for: actual spend amounts (use forecast_cost), 6-month projection (use project_budget),\
    \ per-team breakdown (use compute_team_cost).\n"
compute_monthly_incident_report:
  tool: compute_monthly_incident_report
  questions:
  - How many incidents occurred this month and what was the total downtime in minutes?
  - Show me the P1, P2, and P3 incident breakdown for this month vs last month.
  - Which services were most impacted by incidents this month ranked by downtime?
  - Are incidents increasing or decreasing compared to the previous month?
  - What is the total downtime per severity level for July 2026?
  - Give me the monthly operational health summary for the board report.
  description: Compute a monthly incident report with total downtime in minutes, P1/P2/P3 breakdown month
    over month, and the services most impacted by downtime
compute_mttr_trend:
  tool: compute_mttr_trend
  questions:
  - What is our Mean Time To Recovery (MTTR) trend over the last 3 months?
  - Is our MTTR improving or degrading compared to last quarter?
  - Show me the P1 and P2 MTTR for the last 3 months with benchmark comparison.
  - Which were the 3 slowest incidents to resolve and what were their root causes?
  - Are we meeting the industry standard of P1 < 30min and P2 < 2h MTTR?
  - "How effective have our on-call process improvements been \u2014 measure MTTR trend."
  description: "Compute Mean Time To Recovery (MTTR) trend for incident resolution speed \u2014 how fast\
    \ the team recovers from outages. NOT for pipeline build/deploy performance. P1 and P2 MTTR against\
    \ industry benchmarks, and the slowest incidents"
compute_optimization_roi:
  tool: compute_optimization_roi
  questions:
  - What is the ROI of our last Kubernetes optimization sprint?
  - How much did our optimization sprint save per month and per year?
  - Which optimizations had the biggest cost impact last sprint?
  - Did our cost reduction hurt latency or reliability?
  - Show me the business value of our right-sizing sprint for the board.
  - Prove the savings from our last cost-optimization sprint with before and after numbers.
  description: 'OPTIMIZATION SPRINT ROI: compute the return-on-investment of a completed optimization
    or right-sizing sprint. Shows monthly/yearly savings, biggest cost impacts, and whether reliability
    was affected. Answers: "what was the ROI of our optimization sprint", "how much did we save from right-sizing".
    Use AFTER a cost-saving initiative is complete, not before. Do NOT use for: estimating potential future
    savings (use estimate_rightsizing_savings), detecting current waste (use detect_over_provisioned_namespaces).

    '
compute_prediction_roi:
  tool: compute_prediction_roi
  questions:
  - How much did we save from predictions this month?
  - What is the ROI of our automatic alerts?
  - How many potential incidents were detected and prevented?
  - Show me the losses avoided thanks to Hexawyn this month.
  - How much did predictions save us this month?
  - How much did we save from predictions this month?
  - What is the ROI of our automatic alerts?
  - How many potential incidents were detected and prevented?
  description: 'ALERTING ROI: compute return-on-investment of automatic predictions and alerts. Shows
    how much was saved this month from prevented incidents, how many incidents were caught. Answers: "how
    much did predictions save us", "how many incidents were prevented automatically". This is about PROACTIVE
    ALERTING value, not cost optimization. Do NOT use for: general cost savings (use estimate_rightsizing_savings),
    optimization sprint ROI (use compute_optimization_roi).

    '
compute_security_posture:
  tool: compute_security_posture
  questions:
  - What percentage of our workloads are compliant with our security policies?
  - Give me our overall security posture score with a breakdown by category.
  - Which non-compliant workloads should we remediate first for the board report?
  - Is our security compliance improving or degrading versus last quarter?
  - How many workloads fail TLS, RBAC, Pod Security, image scanning or secret rotation?
  - Show me our security compliance score so I can report our posture to the board.
  - What is our overall security compliance score?
  - Show me the security posture breakdown by category.
  - Which non-compliant workloads should we fix first?
  description: Compute an overall security compliance score with a breakdown by category (TLS, RBAC, Pod
    Security, image scanning, secret rotation) and which non-compliant workloads to fix first
compute_slo_error_budget:
  tool: compute_slo_error_budget
  questions:
  - "What is the current error budget burn rate for the payment-service SLO \u2014 are we on track to\
    \ exhaust the error budget before end of month?"
  - How much error budget remains for auth-service with an SLO of 99.9%?
  - Is the checkout-service at risk of breaching its 30-day SLO based on the current error rate?
  - Show me the burn rate and time-to-exhaustion for all production services this week.
  - Has any service already exhausted its error budget this month?
  - Compare this month's error budget consumption against last month for degraded services.
  description: Compute the SLO error budget burn rate and time to exhaustion for a service, how much budget
    remains against a 99.9% target, and which services already exhausted their budget
compute_team_cost:
  tool: compute_team_cost
  questions:
  - Which team is consuming the most cluster resources and at what cost?
  - Show me the infrastructure cost breakdown per team for this month.
  - How has each team's resource consumption changed compared to last month?
  - Which team has the highest CPU and memory cost in production?
  - Are there any unattributed costs from namespaces without a team label?
  - Rank all teams by total cloud spend and highlight teams that scaled up significantly.
  description: 'TEAM-LEVEL COST BREAKDOWN: break down infrastructure cost by team, rank teams by cloud
    spend. Flags unattributed costs from namespaces without a team label. Answers: "which team costs the
    most", "cost per team this month", "any unlabeled namespaces". Use for organizational cost allocation,
    not for finding waste. Do NOT use for: per-service comparison (use compare_service_cost), monthly
    spend forecast (use forecast_cost), finding waste (use detect_over_provisioned_namespaces).

    '
configuration_drift_detection:
  tool: configuration_drift_detection
  questions:
  - "Has any resource configuration drifted from its Helm or Kustomize desired state \u2014 which live\
    \ resources differ from what is declared in Git?"
  - Did someone manually patch the payment-service deployment after it was deployed by Helm?
  - Is the checkout-config ConfigMap still in sync with what's in the chart?
  - Are there any resources left over from a Helm release that no longer exists?
  - Which drifted resources are actually critical, not just cosmetic?
  description: Detect live resources that drifted from their Helm or Kustomize desired state in Git, manual
    patches applied after deploy, and orphaned resources from deleted releases
conservative_namespace_overview:
  tool: conservative_namespace_overview
  questions:
  - "Give me a conservative overview of the staging namespace \u2014 total pods, services, deployments,\
    \ and any obvious health issues, without flooding the context with raw data."
  - Is the payment namespace healthy right now?
  - What's broken in production, in one line?
  - Give me a quick health check on checkout, capped to 500 tokens.
  - Does staging exist, and if so, is anything degraded?
  description: Give a compact token-capped overview of a namespace with pod, service and deployment counts
    and obvious health issues, without flooding context with raw data
container_image_drift_detection:
  tool: detect_container_image_drift
  questions:
  - "Show me all deployments running a container image that differs from what is declared in the Git repository\
    \ \u2014 which ones are out of sync?"
  - Is payment-service running the Helm-declared image, or has someone deployed a hotfix directly?
  - Are any of our mutable image tags actually pointing to different bytes than what we deployed?
  - Which containers are out of sync because of a tag change versus a digest change?
  - "Ignore anything still pinned to latest \u2014 what's genuinely drifted?"
  description: Detect deployments running a container image different from what Git declares, hotfixes
    deployed directly, and mutable tags pointing to different bytes than deployed
container_image_vulnerability_scanning:
  tool: scan_container_vulnerabilities
  questions:
  - "Which containers are using deprecated or known-vulnerable base images \u2014 which CVEs affect our\
    \ current running workloads?"
  - Does payment:v1.2 have any Critical CVEs, and is there a fix version available?
  - Are we running any images with an end-of-life base image like ubuntu:18.04 or python:3.8-slim?
  - Which Critical CVEs in production should we patch first?
  - How many of our running images are actually affected by known vulnerabilities?
  - Are any of our images running on a mutable latest tag we can't pin a scan to?
  description: Scan container images for known vulnerabilities, including EOL base images, critical CVEs
    and missing patch levels, and flag production workloads.
cost_profiling:
