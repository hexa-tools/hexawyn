    workloads to resize first", "help me cut infrastructure costs". Do NOT use for: detecting waste locations
    (use detect_over_provisioned_namespaces), monthly spend forecast (use forecast_cost), checking budget
    status (use compute_budget_intelligence).

    '
etcd_logs:
  tool: etcd_logs
  questions:
  - "Show me the etcd logs from the last hour \u2014 are there any leader election issues?"
  - Are there compaction errors in the etcd logs?
  - "Is the etcd cluster stable \u2014 check for leader changes in the last hour"
  - Retrieve etcd error logs from the last 30 minutes
  - Has there been any etcd leader election instability recently?
