  - Compare the effective Helm values of my release across environments and flag risky diffs.
  - Show me all values that differ between staging and production Helm releases.
  - What configuration differences could explain behavior gaps between environments?
  - Are staging and production in sync for the checkout release?
  description: Diff effective Helm values between staging and production for a release, flag risky differences,
