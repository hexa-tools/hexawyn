  - Is my cloud spend accelerating compared to last week?
  - Which are the 3 most expensive namespaces this month?
  - "My monthly budget is $2,000 \u2014 will I exceed it?"
  - What is the cost trend for my cluster compared to last month?
  - Project my end-of-month Kubernetes spend based on the last 7 days
  - Which namespace is driving the most cost growth this month?
  description: "CURRENT MONTH SPEND FORECAST: the PRIMARY cost tool. Projects end-of-month Kubernetes\
