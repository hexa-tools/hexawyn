detect_outdated_helm_releases:
  tool: detect_outdated_helm_releases
  questions:
  - "Which Helm releases are out of date compared to the latest available chart version \u2014 what are\
    \ the changelogs and breaking changes I need to be aware of?"
  - Show me all Helm charts that need a version upgrade with their changelogs.
  - Are there any major version updates pending that could break our services?
  - List outdated Helm releases grouped by namespace with their version delta type.
  - What breaking changes should I be aware of before upgrading cert-manager to the latest version?
  - Which releases haven't been upgraded in several audit cycles and are chronically outdated?
  description: Detect Helm releases behind the latest chart version, their changelogs and breaking changes,
    major version updates that could break services, and chronically outdated releases
detect_over_provisioned_namespaces:
  tool: detect_over_provisioned_namespaces
  questions:
  - Which namespaces are wasting the most CPU and memory?
  - Where can we reduce resource costs in the cluster?
  - Show me the top 5 over-provisioned namespaces over the last 7 days
  - "The dev namespace has 8 CPUs allocated \u2014 how much is it actually using?"
  - What's our total estimated waste in cores and GB across all namespaces?
  - Which teams are over-requesting resources compared to their actual usage?
  - Find all namespaces where resource requests are more than double actual usage
  description: "WASTE DETECTION: find namespaces with resource requests far above actual usage. Ranks\
    \ most over-provisioned namespaces, estimates total waste in CPU cores and GB. This is the DIAGNOSTIC\
    \ step \u2014 it identifies WHERE waste exists, not how much you'd save. Use FIRST, before estimate_rightsizing_savings\
    \ or estimate_cost_saving. Do NOT use for: savings estimates (use estimate_rightsizing_savings), per-service\
    \ cost (use compare_service_cost), monthly forecast (use forecast_cost).\n"
detect_pod_anomalies:
  tool: detect_pod_anomalies
  questions:
  - "Detect anomalies across all pods in production \u2014 which ones show unusual CPU spikes, memory\
    \ patterns, or error rate deviations vs baseline?"
  - Is payment-api using more CPU than usual right now?
  - Any pods in production drifting toward a memory leak over the last few hours?
  - Give me a ranked list of anomalous pods in the checkout namespace, worst first.
  - Which pods don't have enough history yet to even compare against a baseline?
  description: "Detect pods with anomalous behavior versus baseline \u2014 unusual CPU spikes, memory\
    \ leak trends, error rate deviations \u2014 and rank the most anomalous pods"
detect_privileged_pods:
  tool: detect_privileged_pods
