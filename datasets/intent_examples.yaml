  - How much CPU and memory has each namespace requested across all its pods?
  - "Rank all my namespaces by total resource requests \u2014 I need to know which ones consume the most."
  - Give me a breakdown of CPU and memory requests per namespace with pod counts.
  - What is the total resource footprint per namespace in my cluster?
  - "List all namespaces ordered by CPU requests \u2014 which one would I scale down first?"
  description: "REQUESTS RANKING: rank namespaces cluster-wide by their configured CPU/memory requests\
    \ and pod count. Answers \"which namespaces have the highest requests\" / \"which namespace has the\
    \ most pods\" \u2014 distinct from get_resource_usage (live usage for ONE named namespace, not a ranking)\
    \ and detect_over_provisioned_namespaces (waste percentage, not raw requests or pod count). Use when\
    \ the question asks to rank or compare namespaces by requested CPU/memory or pod count, without naming\
    \ one specific namespace to check usage for.\n"
get_resource_usage:
  tool: get_resource_usage
  questions:
  - "Namespace dev has 8 CPUs allocated \u2014 how much is it actually using?"
  - Show me real CPU and memory usage per pod across all namespaces from metrics-server.
  - Is the staging namespace really over-provisioned or just configured that way? Compare requests vs
    actual usage.
  - Which pods in production are using the most memory right now?
  - "Give me per-pod resource utilization percentages \u2014 I want to see the gap between requests and\
    \ real consumption."
  - How much CPU and memory is each namespace actually consuming compared to what it requested?
  - Show me namespace-level utilization summaries with pod counts and usage percentages.
  description: "ACTUAL USAGE: report real, live CPU/memory consumption for a named namespace, compared\
    \ against its configured requests. Answers \"how much is X actually using\" for ONE named namespace\
    \ \u2014 distinct from detect_over_provisioned_namespaces (which ranks namespaces by waste percentage\
    \ cluster-wide, not a single namespace's live usage) and resource_yaml (which shows static config,\
    \ not usage). Use when the question names a specific namespace and asks about its current/actual usage.\n"
estimate_cost_saving:
  tool: estimate_cost_saving
  description: "MISSING RESOURCE REQUEST AUDIT: detect pods and namespaces with NO resource requests configured.\
    \ Identify over-provisioned workloads by comparing requests to actual usage, estimate savings from\
    \ setting proper requests. Answers: \"which pods have no CPU/memory requests\", \"find namespaces\
    \ with unconfigured pods\". This is about MISSING CONFIGURATION \u2014 pods without any requests at\
    \ all. Do NOT use for: general rightsizing savings (use estimate_rightsizing_savings), namespace waste\
    \ analysis (use detect_over_provisioned_namespaces).\n"
  questions:
  - Which pods have no resource requests configured and where are they running?
  - Find namespaces with pods missing CPU or memory requests
  - Which namespaces would benefit most from setting proper resource requests?
  - Check for pods without resource limits that could cause noisy-neighbor issues
  - Show me namespaces with the most unconfigured pods
run_consolidation:
  tool: run_consolidation
  description: "WORKLOAD CONSOLIDATION PLAN: identify services that can be merged onto fewer nodes to\
    \ reduce infrastructure cost. Finds idle nodes, pods that can be colocated, CPU/memory savings from\
    \ consolidation. Answers: \"which services can run on the same node\", \"consolidate workloads to\
    \ save costs\", \"how many nodes can we remove\", \"can I merge these 3 services onto 2 nodes\". This\
    \ is about MOVING EXISTING workloads to fewer nodes \u2014 NOT simulating new workloads. Do NOT use\
    \ for: simulating new workloads (use cluster_headroom_simulation), what-if impact of changes (use\
    \ run_what_if_simulation), general rightsizing savings (use estimate_rightsizing_savings).\n"
  questions:
  - Which services can be consolidated onto fewer nodes to reduce infrastructure cost?
  - How many idle nodes do we have and what can we consolidate?
  - Can I merge the notification service, report generator and webhook handler onto existing nodes?
  - Which pods can be colocated without performance impact?
  - Show me a consolidation plan ranked by cost savings.
  - How much CPU and memory would we save by consolidating staging and dev workloads?
