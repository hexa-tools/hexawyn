# Intent examples — centralized use case questions for PlannerAgent (BM25 + few-shot)
#
# This file must stay in sync between hexawyn/datasets/intent_examples.yaml (source of
# truth, reviewed in PRs) and hexa-knowledge/datasets/intent_examples.yaml (feeds BM25
# ranking + PlannerAgent at runtime). Update both in the same task (see AGENTS.md §7).
#
# Rules:
#   - Minimum 5 question variants per use case, covering different phrasing styles:
#     technical/precise, vague/casual, business-oriented, direct command, question style
#   - tool: must match the exact MCP tool name registered in mcp/tools/
#   - Key must be the real use case name (snake_case) — never a ticket number
#   - Only add entries for implemented tools (non-empty mcp/tools/*.py)
#   - Before adding new questions, check for semantic collisions with existing use cases

# ── Cluster Inventory ─────────────────────────────────────────────────────

list_namespaces:
  tool: list_namespaces
  questions:
    - "List all Kubernetes namespaces in the cluster"
    - "What namespaces exist and how old are they?"
    - "Which namespaces were created recently?"
    - "Show me the full namespace inventory for this cluster"
    - "How many namespaces do I have and what are their ages?"
    - "Give me all namespaces with their status and age"
    - "How many namespaces do we have running in production?"

list_pods:
  tool: list_pods
  questions:
    - "List all pods in the production namespace"
    - "Are there any unhealthy pods in the payment-service namespace?"
    - "Which pods are in CrashLoopBackOff in staging?"
    - "Show me the pod health status for the ci namespace"
    - "What is the current state of all pods in my cluster?"
    - "Are there any pods that are not running in my cluster?"
    - "List all pods sorted by health — show me the failing ones first"

# ── Tekton Pipelines ──────────────────────────────────────────────────────

list_task_runs:
  tool: list_task_runs
  questions:
    - "List all TaskRuns for the build-deploy pipeline — which step is failing?"
    - "What's the status of each step in the payment-service pipeline?"
    - "Which task step broke the checkout pipeline?"
    - "Show me the TaskRuns for the ci/deploy-api pipeline"
    - "Which steps of my pipeline are currently running or failed?"
    - "Which Tekton task failed in the last build?"
    - "What was the error in the last TaskRun for the auth pipeline?"

list_pipeline_runs:
  tool: list_pipeline_runs
  questions:
    - "Show me the last 10 pipeline runs for the payment-service — what is the success rate?"
    - "How often does the checkout pipeline fail?"
    - "What's the average build time for the auth-service?"
    - "Are there any abnormally slow runs in the payment pipeline recently?"
    - "What is the failure rate of the deploy-api pipeline over the last week?"
    - "How reliable is the deploy pipeline for the recommendation-engine service?"
    - "Give me the pipeline run history for the data-ingestion service"

list_pipeline_runs_in_namespace:
  tool: list_pipeline_runs_in_namespace
  questions:
    - "What's the current status of all pipelines in the tekton namespace?"
    - "Are there any stuck or failing pipelines in production?"
    - "Show me all failed PipelineRuns in the ci namespace"
    - "Which pipelines have been running for more than an hour?"
    - "Give me an overview of all pipeline activity in the staging namespace"
    - "Are there any pipelines that are stuck in the tekton namespace right now?"

get_pipeline_run_status:
  tool: get_pipeline_run_status
  questions:
    - "What is the current status of all Tekton PipelineRuns in the CI namespace?"
    - "How many builds succeeded or failed in the last 24 hours?"
    - "Which pipeline run took the longest to complete today?"
    - "Show me the most recent failed build and why it failed"
    - "Are there any stuck or pending pipeline runs in ci?"

trace_pipeline_run_dag:
  tool: trace_pipeline_run_dag
  questions:
    - "Trace the full execution path of PipelineRun deploy-checkout-v5 — show me the complete DAG of TaskRuns with their start times, durations, and dependencies."
    - "What is the critical path for the payment-service pipeline — which tasks are the bottleneck?"
    - "Show me the execution DAG for pipeline-run-42, highlight any failed or skipped tasks"
    - "Which TaskRuns ran in parallel vs sequentially in the latest CI pipeline?"
    - "Give me a visual dependency graph of the deploy-staging PipelineRun with timestamps"

pipeline_performance_baseline:
  tool: pipeline_performance_baseline
  questions:
    - "Establish a CI/CD performance baseline for the payment-service pipeline — what is the average build time, test time, and deploy time over the last 30 runs?"
    - "Has the checkout pipeline been getting slower over the last week? Show me the trend."
    - "Which pipeline runs are outliers — taking more than double the average build time?"
    - "Give me the p50 and p95 durations for each stage of the deploy-api pipeline"
    - "Is the CI pipeline performance improving, stable, or degrading compared to last month?"

# ── FinOps ────────────────────────────────────────────────────────────────

detect_over_provisioned_namespaces:
  tool: detect_over_provisioned_namespaces
  questions:
    - "Which namespaces are wasting the most CPU and memory?"
    - "Where can we reduce resource costs in the cluster?"
    - "Show me the top 5 over-provisioned namespaces over the last 7 days"
    - "The dev namespace has 8 CPUs allocated — how much is it actually using?"
    - "What's our total estimated waste in cores and GB across all namespaces?"
    - "Which teams are over-requesting resources compared to their actual usage?"
    - "Find all namespaces where resource requests are more than double actual usage"

estimate_rightsizing_savings:
  tool: estimate_rightsizing_savings
  questions:
    - "Which of my workloads are over-provisioned and what would I save by rightsizing them?"
    - "How much money am I wasting on CPU and memory for my Kubernetes deployments?"
    - "Show me the top 5 rightsizing recommendations ranked by monthly savings"
    - "My ml-worker pod uses very little CPU — what should I request instead?"
    - "Are any of my deployments under-provisioned and at risk of OOM kill?"
    - "Give me rightsizing recommendations for all workloads in the production namespace"

rightsizing_cost_estimation:
  tool: estimate_cost_saving
  questions:
    - "What is my estimated cloud cost saving if I right-size all over-provisioned pods to match their actual usage?"
    - "Which pods waste the most CPU and memory, and how much could I save per month?"
    - "Give me the top 10 cost-saving opportunities by right-sizing with $0.05/core/hour pricing"
    - "How much money am I wasting in the production namespace from over-provisioned pods?"
    - "How much would I save monthly if I right-sized all pods to p95 actual usage with a 20% buffer?"
    - "Are there any over-provisioned pods I can safely shrink to reduce my cloud bill?"
    - "Estimate how much we'd save by reducing CPU and memory requests to match real usage cluster-wide"

forecast_cost:
  tool: forecast_cost
  questions:
    - "How much will I spend this month on my Kubernetes cluster?"
    - "Is my cloud spend accelerating compared to last week?"
    - "Which are the 3 most expensive namespaces this month?"
    - "My monthly budget is $2,000 — will I exceed it?"
    - "What is the cost trend for my cluster compared to last month?"
    - "Project my end-of-month Kubernetes spend based on the last 7 days"
    - "Which namespace is driving the most cost growth this month?"

# ── Reliability & Security ────────────────────────────────────────────────

detect_zombies:
  tool: detect_zombies
  questions:
    - "Which pods have been running with 0 traffic for the last 24 hours — are there zombie deployments we can safely remove?"
    - "Can you list all pods that received no network traffic in the last day?"
    - "Are there any zombie workloads wasting compute resources in my cluster?"
    - "How much money would I save by removing idle pods from production?"
    - "Show me pods with zero RPS — flag the ones safe to decommission"
    - "Find all deployments with no traffic in the last 24 hours"
    - "Which services haven't received a single request today?"

check_cluster_certificate_health:
  tool: check_cluster_certificate_health
  questions:
    - "Which TLS certificates in the cluster are expiring soon?"
    - "Are any certificates going to expire in the next 7 days?"
    - "Show me all expired certificates across all namespaces"
    - "Which TLS secrets are not referenced by any ingress — orphaned certs?"
    - "Is cert-manager managing the renewal of my production certificates?"

check_resource_constraints:
  tool: check_resource_constraints
  questions:
    - "Are any pods in production close to hitting their CPU or memory limits? Which ones are throttled or at risk of OOMKill?"
    - "Show me all containers where CPU usage exceeds 80% of the limit"
    - "Which pods are at risk of being OOMKilled in the staging namespace?"
    - "Are there any pods running without resource limits configured?"
    - "Give me a resource pressure report for all containers in production, sorted by risk"

# ── Fleet Health ──────────────────────────────────────────────────────────

global_health_check:
  tool: global_health_check
  questions:
    - "Give me a global health check of the cluster fleet — what is the overall status right now?"
    - "Which cluster is the least healthy in my fleet?"
    - "Are all my Kubernetes clusters reachable and healthy?"
    - "What are the critical issues across all my clusters right now?"
    - "Is the overall fleet health improving or degrading compared to last week?"
    - "Show me a breakdown by category — nodes, pods, CPU, certificates — for every cluster in the fleet"
    - "Give me an executive summary of the entire fleet — one health score per cluster"

# ── Simulation ─────────────────────────────────────────────────────────────

run_what_if_simulation:
  tool: run_what_if_simulation
  questions:
    - "What would happen to the cluster if I scale down the auth-service to 1 replica? Simulate the impact on latency, error rate, and dependent services."
    - "If I double the replicas of payment-service, which downstream services will be affected?"
    - "Simulate scaling the checkout-service from 3 to 1 — is it safe during peak traffic?"
    - "Show me the blast radius if I remove the caching layer — which services depend on redis?"
    - "What's the risk level of reducing api-gateway to 2 replicas given current CPU usage?"

# ── Topology ──────────────────────────────────────────────────────────────

live_dependency_mapping:
  tool: live_topology_mapper
  questions:
    - "Generate a live dependency map of all services currently running in the cluster — show me which services call which, and highlight single points of failure."
    - "Which services would take down the most other services if they went down right now?"
    - "Can you draw me a call graph of the production namespace and flag anything risky?"
    - "How much would it cost us in downtime if auth-service failed — how many services depend on it?"
    - "List all single points of failure in the checkout namespace based on current service topology."
    - "Are there any circular dependencies between our microservices?"

# ── KubeArchive Historical State ────────────────────────────────────────────

query_kubearchive:
  tool: query_kubearchive
  questions:
    - "Query KubeArchive for the historical state of all pods in the payment namespace from last Tuesday — what was the pod count and which ones were restarting?"
    - "What was the state of pods in production at 2026-06-09T10:00:00Z and which ones were crashing?"
    - "How many pods were running in staging last Monday and how does that compare to today?"
    - "Compare the pods in the payment namespace now vs last week — what was added and what was removed?"
    - "Show me which deployments existed in the ci namespace on June 1st"
    - "Were there any pods in CrashLoopBackOff in the production namespace last Tuesday?"
    - "Give me a historical snapshot of all pods in the payment namespace and highlight the failing ones"

# ── GitOps Detection ─────────────────────────────────────────────────────────

gitops_detect:
  tool: gitops_detect
  questions:
    - "Does my cluster use Flux CD or Argo CD?"
    - "Which GitOps engine is installed in the cluster?"
    - "Is Flux CD or Argo CD running in my cluster?"
    - "Detect which GitOps engine is installed and show me the version"
    - "How many applications are managed by GitOps right now?"

gitops_apps_list:
  tool: gitops_apps_list
  questions:
    - "Which GitOps applications are out-of-sync in my cluster?"
    - "List all Flux HelmReleases and Kustomizations in the flux-system namespace"
    - "Show me the status of all my Argo CD applications"
    - "Are there any GitOps applications currently in error?"
    - "Which Argo CD applications are currently degraded or missing?"

gitops_app_get:
  tool: gitops_app_get
  questions:
    - "Why is my payments-api app not synced with Git?"
    - "Get the full status of the payments-api HelmRelease"
    - "What is the last commit deployed for the auth-service Application?"
    - "Show me the details of the frontend application in Argo CD"
    - "Why is my Kustomization failing to reconcile?"

gitops_app_status:
  tool: gitops_app_status
  questions:
    - "What is the sync and health status of the checkout application?"
    - "Is the payments-service healthy according to Flux?"
    - "Show me the reconciliation status of the prod-deploy Application"
    - "When was the last time the staging Kustomization synced?"
    - "Give me the health and sync status of the auth-api HelmRelease"

gitops_app_sync:
  tool: gitops_app_sync
  questions:
    - "What is the latest commit deployed to my cluster via GitOps?"
    - "What is the current revision deployed for the api-gateway?"
    - "When was the last sync of the production HelmRelease?"
    - "Is the payments-api in sync with the latest Git commit?"
    - "Show me the deployed revision for the checkout-service"

gitops_sources_list:
  tool: gitops_sources_list
  questions:
    - "List all GitRepositories used by Flux in my cluster"
    - "What GitOps sources are configured?"
    - "Which Helm repositories are currently unreachable?"
    - "Show me all sources in the flux-system namespace and their ready status"
    - "Are all my GitRepositories healthy and connected?"

gitops_source_get:
  tool: gitops_source_get
  questions:
    - "Why can't my GitRepository connect to GitHub?"
    - "Get the connection status of the prod-manifests GitRepository"
    - "What is the URL and last-updated time of the helm-charts HelmRepository?"
    - "Is the main GitRepository authenticated and ready?"
    - "What's the error message on the staging HelmRepository?"

# ── Argo Rollouts ────────────────────────────────────────────────────────────

rollouts_detect:
  tool: rollouts_detect
  questions:
    - "Is Argo Rollouts installed in my cluster?"
    - "How many rollouts are currently in progress?"
    - "Detect Argo Rollouts and show me the version and rollout counts"
    - "Are there any degraded or paused rollouts right now?"
    - "What is the rollout status across all namespaces?"

rollouts_list:
  tool: rollouts_list
  questions:
    - "List all Argo Rollouts in my cluster with their current phase"
    - "Are there any rollouts in progress right now?"
    - "Show me all canary rollouts in the production namespace"
    - "Which rollouts are currently paused or degraded?"
    - "List all blue-green rollouts with their stable and canary images"

rollout_get:
  tool: rollout_get
  questions:
    - "Why is my canary rollout for payments-api blocked?"
    - "Get the full status of the auth-service rollout with step details"
    - "What is the current canary weight for the checkout rollout?"
    - "Show me the AnalysisRun linked to the production rollout"
    - "What is the current image being rolled out for the frontend service?"

rollout_status:
  tool: rollout_status
  questions:
    - "Is my payments-api canary rollout healthy?"
    - "What step is the checkout rollout on and what is the canary weight?"
    - "Why is the auth-service rollout paused?"
    - "Should I promote or abort the current rollout of the api-gateway?"
    - "Show me the real-time status of the production deployment rollout"

analysis_runs_list:
  tool: analysis_runs_list
  questions:
    - "Are there any AnalysisRuns failing for my rollouts?"
    - "Which metrics failed in the payments-api analysis?"
    - "List all AnalysisRuns associated with the checkout rollout"
    - "Has the automated analysis passed for the production canary?"
    - "Show me all failed AnalysisRuns with their error messages"
