# Intent examples — centralized use case questions for PlannerAgent (BM25 + few-shot)
#
# This file must stay in sync between hexawyn/datasets/intent_examples.yaml (source of
# truth, reviewed in PRs) and hexa-knowledge/datasets/intent_examples.yaml (feeds BM25
# ranking + PlannerAgent at runtime). Update both in the same task (see AGENTS.md §7).
#
# Rules:
#   - Minimum 5 question variants per use case, covering different phrasing styles:
#     technical/precise, vague/casual, business-oriented, direct command, question style
#   - tool: must match the exact MCP tool name registered in mcp/tools/
#   - Key must be the real use case name (snake_case) — never a ticket number
#   - Only add entries for implemented tools (non-empty mcp/tools/*.py)
#   - Before adding new questions, check for semantic collisions with existing use cases

# ── Cluster Inventory ─────────────────────────────────────────────────────

list_namespaces:
  tool: list_namespaces
  questions:
    - "List all Kubernetes namespaces in the cluster"
    - "What namespaces exist and how old are they?"
    - "Which namespaces were created recently?"
    - "Show me the full namespace inventory for this cluster"
    - "How many namespaces do I have and what are their ages?"
    - "Give me all namespaces with their status and age"
    - "How many namespaces do we have running in production?"

list_pods:
  tool: list_pods
  questions:
    - "List all pods in the production namespace"
    - "Are there any unhealthy pods in the payment-service namespace?"
    - "Which pods are in CrashLoopBackOff in staging?"
    - "Show me the pod health status for the ci namespace"
    - "What is the current state of all pods in my cluster?"
    - "Are there any pods that are not running in my cluster?"
    - "List all pods sorted by health — show me the failing ones first"

# ── Tekton Pipelines ──────────────────────────────────────────────────────

list_task_runs:
  tool: list_task_runs
  questions:
    - "List all TaskRuns for the build-deploy pipeline — which step is failing?"
    - "What's the status of each step in the payment-service pipeline?"
    - "Which task step broke the checkout pipeline?"
    - "Show me the TaskRuns for the ci/deploy-api pipeline"
    - "Which steps of my pipeline are currently running or failed?"
    - "Which Tekton task failed in the last build?"
    - "What was the error in the last TaskRun for the auth pipeline?"

list_pipeline_runs:
  tool: list_pipeline_runs
  questions:
    - "Show me the last 10 pipeline runs for the payment-service — what is the success rate?"
    - "How often does the checkout pipeline fail?"
    - "What's the average build time for the auth-service?"
    - "Are there any abnormally slow runs in the payment pipeline recently?"
    - "What is the failure rate of the deploy-api pipeline over the last week?"
    - "How reliable is the deploy pipeline for the recommendation-engine service?"
    - "Give me the pipeline run history for the data-ingestion service"

list_pipeline_runs_in_namespace:
  tool: list_pipeline_runs_in_namespace
  questions:
    - "What's the current status of all pipelines in the tekton namespace?"
    - "Are there any stuck or failing pipelines in production?"
    - "Show me all failed PipelineRuns in the ci namespace"
    - "Which pipelines have been running for more than an hour?"
    - "Give me an overview of all pipeline activity in the staging namespace"
    - "Are there any pipelines that are stuck in the tekton namespace right now?"

get_pipeline_run_status:
  tool: get_pipeline_run_status
  questions:
    - "What is the current status of all Tekton PipelineRuns in the CI namespace?"
    - "How many builds succeeded or failed in the last 24 hours?"
    - "Which pipeline run took the longest to complete today?"
    - "Show me the most recent failed build and why it failed"
    - "Are there any stuck or pending pipeline runs in ci?"

trace_pipeline_run_dag:
  tool: trace_pipeline_run_dag
  questions:
    - "Trace the full execution path of PipelineRun deploy-checkout-v5 — show me the complete DAG of TaskRuns with their start times, durations, and dependencies."
    - "What is the critical path for the payment-service pipeline — which tasks are the bottleneck?"
    - "Show me the execution DAG for pipeline-run-42, highlight any failed or skipped tasks"
    - "Which TaskRuns ran in parallel vs sequentially in the latest CI pipeline?"
    - "Give me a visual dependency graph of the deploy-staging PipelineRun with timestamps"

pipeline_performance_baseline:
  tool: pipeline_performance_baseline
  questions:
    - "Establish a CI/CD performance baseline for the payment-service pipeline — what is the average build time, test time, and deploy time over the last 30 runs?"
    - "Has the checkout pipeline been getting slower over the last week? Show me the trend."
    - "Which pipeline runs are outliers — taking more than double the average build time?"
    - "Give me the p50 and p95 durations for each stage of the deploy-api pipeline"
    - "Is the CI pipeline performance improving, stable, or degrading compared to last month?"

