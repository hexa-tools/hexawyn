version: "3.9"
services:
  hexawyn:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ~/.kube:/root/.kube:ro
      - ~/.hexawyn:/home/hexawyn/.hexawyn
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - KUBECONFIG=/root/.kube/config
      - HEXAWYN_SLACK_WEBHOOK_URL=${HEXAWYN_SLACK_WEBHOOK_URL:-}
      - HEXAWYN_DEMO_MODE=${HEXAWYN_DEMO_MODE:-false}
      - HEXAWYN_DEMO_SCENARIO=${HEXAWYN_DEMO_SCENARIO:-aws_eks}
      - DD_API_KEY=${DD_API_KEY:-}
      - DD_APP_KEY=${DD_APP_KEY:-}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HEXAWYN_LOG_LEVEL=INFO
  hexawyn-demo:
    build: .
    ports:
      - "8001:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HEXAWYN_DEMO_MODE=true
      - HEXAWYN_DEMO_SCENARIO=aws_eks   # Options: aws_eks | azure_aks | gcp_gke | openshift | datadog
      - HEXAWYN_LOG_LEVEL=INFO
